# Single-node Kafka in KRaft mode (no ZooKeeper needed).
# Containers reach the broker at kafka:9092; the host reaches it at localhost:9094.
services:
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot job that creates the topic, then exits.
  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists",
              "--topic", "${KAFKA_TOPIC:-HelloKafkaTopic}", "--partitions", "1", "--replication-factor", "1"]

  java-consumer:
    image: &app-image kafka-bluesky-app:latest
    build: &app-build
      context: ..
      dockerfile: Docker-dir/Dockerfile
    command: ["MyKafkaConsumer"]
    environment: &kafka-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-HelloKafkaTopic}
    depends_on: &wait-for-topic
      kafka-init:
        condition: service_completed_successfully
    tty: true

  # Bluesky stream producer: sends posts matching KEYWORDS to Kafka. No credentials needed.
  java-producer:
    image: *app-image
    build: *app-build
    command: ["MyBlueskyStream"]
    environment:
      <<: *kafka-env
      KEYWORDS: ${KEYWORDS:-donald trump}
    depends_on: *wait-for-topic
    tty: true

  # Interactive producer: type lines and they are sent to the topic.
  #   docker compose run --rm console-producer
  console-producer:
    image: *app-image
    build: *app-build
    command: ["MyKafkaProducer"]
    environment: *kafka-env
    depends_on: *wait-for-topic
    profiles: ["console"]
    stdin_open: true
    tty: true
